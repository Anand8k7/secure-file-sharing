{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-3"><i class="bi bi-lock-fill text-warning"></i> Password Required</h3>
            <p class="text-center text-muted">
                The file <strong>{{ file.original_name }}</strong> is password protected.
            </p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Enter File Password</label>
                    <input type="password" name="file_password" class="form-control" required autofocus>
                </div>
                <button class="btn btn-primary w-100">
                    {% if action == 'preview' %}
                    <i class="bi bi-eye"></i> Verify & Preview
                    {% else %}
                    <i class="bi bi-download"></i> Verify & Download
                    {% endif %}
                </button>
            </form>
            <a href="{{ url_for('dashboard') }}" class="btn btn-link w-100 mt-2">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
