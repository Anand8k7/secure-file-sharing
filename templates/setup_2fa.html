{% extends "base.html" %}
{% block title %}Setup 2FA - SecureVault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h2 class="page-title"><i class="bi bi-shield-lock"></i> Two-Factor Authentication</h2>
            <p class="page-subtitle">Scan the QR code with your authenticator app</p>
        </div>
        <div class="glass-card text-center">
            <div class="p-3 rounded mb-3" style="background:white;display:inline-block;">
                <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" style="width:200px;">
            </div>
            <p class="mono" style="font-size:0.8rem;color:var(--accent-cyan);">Secret: {{ secret }}</p>
            <div class="cyber-divider"></div>
            <form method="POST">
                <input type="hidden" name="secret" value="{{ secret }}">
                <div class="mb-3">
                    <label class="form-label">Enter 6-digit code to verify</label>
                    <input type="text" class="form-control mono text-center" name="totp_code" maxlength="6" required placeholder="000000" style="font-size:1.5rem;letter-spacing:0.5rem;">
                </div>
                <button type="submit" class="btn btn-cyber w-100"><i class="bi bi-check-lg"></i> Verify & Enable</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
