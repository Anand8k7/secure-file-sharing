{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-3"><i class="bi bi-cloud-upload-fill"></i> Share a File</h3>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Select File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Share With</label>
                    <select name="receiver_id" class="form-select" required>
                        <option value="">-- Select User --</option>
                        {% for u in users %}
                        <option value="{{ u.id }}">{{ u.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Expiry Time (hours)</label>
                    <input type="number" name="expiry_hours" class="form-control" value="24" min="1" max="720" required>
                    <small class="text-muted">Access will be blocked after this many hours.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock"></i> File Password <small class="text-muted">(optional)</small></label>
                    <input type="password" name="file_password" class="form-control" placeholder="Leave blank for no password">
                    <small class="text-muted">Receiver must enter this password to download/preview the file.</small>
                </div>
                <button class="btn btn-success w-100"><i class="bi bi-shield-check"></i> Encrypt & Share</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
