{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-3"><i class="bi bi-shield-lock"></i> Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required
                           value="{{ username if needs_2fa else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                {% if needs_2fa %}
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-shield-check"></i> 2FA Code</label>
                    <input type="text" name="totp_code" class="form-control text-center fs-5 font-monospace"
                           maxlength="6" pattern="\d{6}" required placeholder="000000" autofocus>
                    <small class="text-muted">Enter the 6-digit code from your authenticator app.</small>
                </div>
                {% endif %}
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center mt-3">
                Don't have an account? <a href="{{ url_for('register') }}">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
